[build]
  command = "npm test && npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Podcast hosts that omit CORS headers are relayed through this.
[[redirects]]
  from = "/api/feed"
  to = "/.netlify/functions/feed"
  status = 200

# Apple's podcast directory, which also sends no CORS headers.
[[redirects]]
  from = "/api/podcasts"
  to = "/.netlify/functions/podcastsearch"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    cache-control = "no-cache"
