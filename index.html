<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>raagam</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#140B18" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <!-- iOS ignores the manifest; these give it a home-screen icon and full-screen chrome. -->
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="raagam" />
    <style>
      html, body, #root { height: 100%; margin: 0; background: #140B18; }
      body { -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
      }
    </script>
  </body>
</html>
